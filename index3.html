<title>21 час на Луне — кратеры</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='black'/%3E%3Cg transform='rotate(-25 32 32)' fill='none'%3E%3Cpath d='M6 32A26 8 0 0 1 58 32' stroke='white' stroke-width='3.2'/%3E%3Ccircle cx='32' cy='32' r='12.5' fill='white'/%3E%3Cpath d='M6 32A26 8 0 0 0 58 32' stroke='black' stroke-width='8'/%3E%3Cpath d='M6 32A26 8 0 0 0 58 32' stroke='white' stroke-width='3.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;800&family=Oswald:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000;--ink:#fff;--dim:#fff;--tan:#8a7560;
  --glass:rgba(255,255,255,.07);--glass-b:rgba(255,255,255,.2);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 Jost,"Futura","Century Gothic",system-ui,sans-serif;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.hud{position:fixed;width:34px;height:34px;border:2px solid var(--tan);z-index:5;pointer-events:none;opacity:.8}
.hud.a{top:12px;left:12px;border-right:0;border-bottom:0}.hud.b{top:12px;right:12px;border-left:0;border-bottom:0}
.hud.c{bottom:12px;left:12px;border-right:0;border-top:0}.hud.d{bottom:12px;right:12px;border-left:0;border-top:0}

.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
  border:1px solid var(--glass-b);
  border-radius:18px;
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 40px rgba(0,0,0,.45);
}
nav{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:4px;padding:6px;border-radius:999px;max-width:calc(100% - 32px);overflow-x:auto}
nav a{color:var(--ink);text-decoration:none;font-size:15px;padding:7px 16px;border-radius:999px;white-space:nowrap;transition:background .2s}
nav a:hover,nav a:focus-visible{background:rgba(255,255,255,.16);outline:none}

main{position:relative;z-index:2}
section{position:relative;padding:110px 6vw}
.wrap{max-width:1100px;margin:0 auto}

/* hero */
#top{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding-top:120px}
.kicker{display:flex;align-items:center;gap:22px;width:min(1100px,100%);font-weight:800;font-size:clamp(18px,2.4vw,28px);letter-spacing:.04em}
.kicker::before,.kicker::after{content:"";flex:1;height:2px;background:var(--dim);opacity:.7}
h1{margin:0;font-weight:800;font-size:clamp(84px,24vw,360px);line-height:.88;letter-spacing:-.01em;
  background:linear-gradient(180deg,#e0e0e0 0%,#d6d6d6 45%,rgba(214,214,214,0) 92%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;z-index:3}
.moonball{position:absolute;left:50%;bottom:-52vw;width:min(110vw,1500px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;z-index:1;overflow:hidden;
  background:radial-gradient(circle at 50% 8%,#4a4a4a,#262626 38%,#0d0d0d 72%);box-shadow:0 -6px 60px rgba(200,200,200,.12)}
.moonball i{position:absolute;border-radius:50%;background:radial-gradient(circle at 60% 62%,rgba(0,0,0,.55) 0 55%,rgba(255,255,255,.1) 62%,transparent 70%)}
.heroPanel{position:relative;z-index:4;width:min(1000px,100%);margin-top:18px;padding:22px 30px;display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:18px;align-items:center}
.heroPanel p{margin:0;font-weight:500;font-size:clamp(16px,1.7vw,21px)}
.meta small{display:block;font:12px "Share Tech Mono",monospace;color:var(--dim)}
.meta b{font-size:22px;font-weight:500;color:var(--dim)}
.meta.r{text-align:right}
.cta{position:relative;z-index:4;margin-top:34px;display:inline-block;padding:16px 38px;color:var(--ink);text-decoration:none;font:14px "Share Tech Mono",monospace;letter-spacing:.12em;border-radius:10px;transition:transform .2s,background .2s}
.cta:hover,.cta:focus-visible{transform:translateY(-2px);background:rgba(255,255,255,.14);outline:none}
.hint{position:relative;z-index:4;margin-top:20px;font:12px "Share Tech Mono",monospace;color:#fff}

/* generic */
h2{font-weight:800;font-size:clamp(34px,5.5vw,68px);line-height:1;margin:0 0 18px}
.lead{max-width:640px;color:var(--dim);margin:0 0 44px}
.panel{padding:28px 30px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.stat b{display:block;font-weight:800;font-size:clamp(34px,4vw,50px);line-height:1}
.stat span{color:var(--dim);font-size:16px}

/* crater explorer */
.explorer{display:grid;grid-template-columns:260px 1fr;gap:16px}
.tabs{display:flex;flex-direction:column;gap:8px;padding:10px}
.tab{all:unset;cursor:pointer;padding:12px 16px;border-radius:12px;font-weight:500;transition:background .2s}
.tab:hover{background:rgba(255,255,255,.1)}
.tab:focus-visible{outline:2px solid var(--tan)}
.tab[aria-selected=true]{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.detail{padding:32px;min-height:340px}
.detail h3{margin:0 0 6px;font-weight:800;font-size:clamp(28px,3.4vw,42px)}
.detail .tag{font:13px "Share Tech Mono",monospace;color:var(--dim);margin-bottom:18px;display:block}
.detail p{margin:0 0 22px;max-width:560px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bars div{padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.bars small{display:block;font:12px "Share Tech Mono",monospace;color:var(--dim)}
.bars b{font-size:24px;font-weight:500}
.size{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:22px;overflow:hidden}
.size i{display:block;height:100%;background:linear-gradient(90deg,var(--tan),#e3e3e3);transition:width .5s}
.size-l{font:12px "Share Tech Mono",monospace;color:var(--dim);margin-top:8px}

/* formation */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;counter-reset:s}
.step{padding:26px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-b);font:15px "Share Tech Mono",monospace;margin-bottom:14px;background:rgba(255,255,255,.08)}
.step h3{margin:0 0 8px;font-weight:800;font-size:24px}
.step p{margin:0;color:var(--dim);font-size:16px}

.quote{padding:44px;text-align:center;font-weight:500;font-size:clamp(22px,3vw,34px);line-height:1.3}
.quote small{display:block;margin-top:16px;font:13px "Share Tech Mono",monospace;color:var(--dim)}
footer{position:relative;z-index:2;padding:40px 6vw 70px;text-align:center;color:#fff;font:13px "Share Tech Mono",monospace}

@media(max-width:760px){
  section{padding:84px 5vw}
  .heroPanel{grid-template-columns:1fr;text-align:center}.meta.r{text-align:center}
  .explorer{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto}.tab{white-space:nowrap}
  .bars{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.settings{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:24px;z-index:11}
.gear{all:unset;cursor:pointer;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:var(--ink);transition:background .2s,transform .5s}
.gear:hover,.gear:focus-visible{background:rgba(255,255,255,.16)}
.gear:focus-visible{outline:2px solid var(--tan)}
.settings.open .gear{transform:rotate(90deg)}
.lang{position:absolute;top:56px;right:0;display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:16px;min-width:150px;opacity:0;visibility:hidden;transform:perspective(800px) rotateX(-40deg);transform-origin:50% 0;transition:opacity .3s,transform .5s cubic-bezier(.2,.8,.2,1),visibility .3s}
.settings.open .lang{opacity:1;visibility:visible;transform:none}
.lang button{font-size:15px!important;padding:10px 14px!important;border-radius:10px!important}
@media(max-width:760px){.settings{right:16px}nav{left:16px;transform:none;max-width:calc(100% - 92px)}}
.lang button{all:unset;cursor:pointer;font:13px "Share Tech Mono",monospace;padding:7px 10px;border-radius:999px;color:var(--dim)}
.lang button[aria-pressed=true]{background:rgba(255,255,255,.2);color:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--tan)}
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;background:linear-gradient(90deg,var(--tan),#e3e3e3);transform:scaleX(0);transform-origin:0 50%}
.wrap{transform-origin:50% 0}
h1{animation:rise 1.8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(70px) scale(.9);filter:blur(16px);letter-spacing:.1em}to{opacity:1;transform:none;filter:blur(0);letter-spacing:.04em}}
.kicker{animation:fadeL 1.2s .2s backwards}
@keyframes fadeL{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:none}}
.moonball{animation:ballIn 2.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes ballIn{from{opacity:0;margin-top:30vw}to{opacity:1;margin-top:0}}
.rv{transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1),clip-path 1s ease;transition-delay:var(--d,0s)}
.js .rv{opacity:0}
.js .rv.flip{transform:translateY(46px) perspective(900px) rotateX(-22deg);transform-origin:50% 0}
.js .rv.sl{transform:translateX(-60px)}
.js .rv.sr{transform:translateX(60px)}
.js .rv.zoom{transform:scale(.9) translateY(30px)}
.js .rv.wipe{clip-path:inset(0 100% 0 0)}
.js .rv.in{opacity:1;transform:none;clip-path:none}
.js .rv.wipe.in{clip-path:inset(-25% -5% -25% -5%)}
.turn{animation:turn .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
@keyframes turn{from{opacity:0;transform:perspective(1000px) rotateX(-55deg)}to{opacity:1;transform:none}}
.tab{transition:background .2s,transform .3s}.tab:hover{transform:translateX(4px)}
.stat{transition:transform .35s}.stat:hover,.step:hover{transform:translateY(-6px) perspective(800px) rotateX(4deg)}
@media(prefers-reduced-motion:reduce){.js .rv{opacity:1!important;transform:none!important;clip-path:none!important}h1,.kicker,.moonball,.turn{animation:none}}

.moonball{width:clamp(900px,115vw,1500px);aspect-ratio:1024/576;bottom:calc(clamp(900px,115vw,1500px)*-.42);z-index:2;border-radius:0;box-shadow:none;background:var(--moon) center bottom/100% 100% no-repeat;
  filter:brightness(.95)}
.moonball i{display:none}

:root{--disp:Oswald,"Arial Narrow",Impact,sans-serif}
h1,h2{font-family:var(--disp);text-transform:uppercase}
h1{z-index:1;font-weight:700;font-size:clamp(110px,min(33vw,50vh),520px);line-height:.9;letter-spacing:-.01em;background:linear-gradient(180deg,#fff 0%,#f4f4f4 55%,rgba(255,255,255,.5) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:700;font-size:clamp(42px,6.5vw,88px);letter-spacing:.01em;line-height:.95}
.glass{background-color:rgba(0,0,0,.3)}
.heroPanel,.hint,.kicker,.cta{text-shadow:0 1px 14px rgba(0,0,0,.75)}
.hint,footer{opacity:1}
.lead,.stat span,.step p,.detail p{color:#fff}

.glass{-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);background-color:rgba(8,8,8,.22);border-color:rgba(255,255,255,.3);
  background-image:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 45%,rgba(255,255,255,.1))}
.lead.glass{display:block;width:fit-content;padding:18px 24px;border-radius:16px}
section{overflow-x:clip}
section:not(#top)::before,section:not(#top)::after{content:"";position:absolute;z-index:-1;pointer-events:none}
section:not(#top)::before{width:min(110vw,1100px);height:min(62vw,620px);background:var(--moon) no-repeat;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 45%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 45%,transparent 100%);filter:brightness(.8)}
section:not(#top)::after{width:min(70vw,560px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(160,130,100,.5),transparent 66%);filter:blur(24px)}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-30px) scale(1.15)}}
#facts::before{right:-24%;top:6%;background-size:cover;background-position:center}
#facts::after{left:-10%;bottom:4%}
#craters::before{left:-28%;top:18%;background-size:200% auto;background-position:82% 88%}
#craters::after{right:-8%;top:10%}
#origin::before{left:50%;margin-left:min(-55vw,-550px);bottom:-8%;background-size:150% auto;background-position:62% 100%}
#origin::after{right:6%;top:2%}
@media(max-width:760px){#facts::before,#craters::before{opacity:.8}}
.title{position:relative;width:100%;display:flex;justify-content:center}
#top{overflow:visible;overflow-x:clip;z-index:0;padding-top:130px}
h1{font-size:clamp(110px,min(31vw,41vh),500px);letter-spacing:.04em}
.moonball{top:calc(78% - clamp(900px,115vw,1500px)*.0467);bottom:auto;filter:brightness(.62);
  -webkit-mask-image:linear-gradient(to bottom,#000 50%,transparent 90%);mask-image:linear-gradient(to bottom,#000 50%,transparent 90%)}
.heroPanel{width:min(1100px,100%)}
.hint{display:inline-block;padding:6px 16px;border-radius:999px}
.num{display:block;font:13px "Share Tech Mono",monospace;letter-spacing:.25em;margin-bottom:10px;opacity:.75}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.tl{list-style:none;margin:0;padding:0 0 0 30px;border-left:1px solid var(--glass-b);display:grid;gap:18px;max-width:820px}
.tli{padding:24px 28px;position:relative}
.tli::before{content:"";position:absolute;left:-37px;top:30px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.18),0 0 18px #fff}
.tli time{display:block;font:13px "Share Tech Mono",monospace;letter-spacing:.12em;margin-bottom:6px;opacity:.85}
.tli h3{margin:0 0 8px;font-weight:800;font-size:28px;line-height:1.1}
.tli p{margin:0;max-width:600px}
.tlph{margin:18px 0 0;border-radius:12px;overflow:hidden;position:relative;height:240px}
.tlph img,.gf img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.tli:hover .tlph img,.gf:hover img{transform:scale(1.06)}
figcaption{font-size:14px}
.tlph figcaption{position:absolute;left:10px;bottom:10px;right:10px;padding:7px 12px;border-radius:10px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.gf{margin:0;overflow:hidden;padding:0}
.gf img{height:260px}
.gf figcaption{padding:14px 18px 16px}
.gf small,.ph small{display:block;font:11px "Share Tech Mono",monospace;opacity:.7;margin-top:4px}
.ph{margin:-32px -32px 22px;height:210px;overflow:hidden;position:relative;border-radius:18px 18px 0 0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media(max-width:760px){
 nav{overflow-x:auto}nav a{padding:7px 12px;font-size:14px}
 .heroPanel{grid-template-columns:1fr 1fr;grid-template-areas:"m y" "p p";padding:16px 18px;gap:10px 14px;text-align:left}
 .heroPanel .meta:first-child{grid-area:m;text-align:left}.heroPanel .meta.r{grid-area:y;text-align:right}
 .heroPanel p{grid-area:p;font-size:15px;text-align:center}
 .cta{padding:12px 24px;font-size:12px}.hint{font-size:11px;padding:5px 12px}
 .moonball{top:calc(96% - 42px)}
 .tli{padding:20px}.tli h3{font-size:24px}.tlph{height:200px}.ph{margin:-24px -24px 18px;height:170px}.detail{padding:24px}
}
.lang .sep{height:1px;background:var(--glass-b);margin:6px 4px}.lang small{font:11px "Share Tech Mono",monospace;opacity:.7;padding:4px 14px}
#glow{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .8s}
#glow i{position:absolute;display:block;border-radius:50%}
#glow .a1{width:120vmax;height:70vmax;right:-48vmax;top:-34vmax;border:7vmax solid rgba(70,160,255,.3);filter:blur(2.6vmax);transform:rotate(-20deg)}
#glow .a2{width:100vmax;height:56vmax;left:-52vmax;bottom:-30vmax;border:5vmax solid rgba(120,205,255,.24);filter:blur(2vmax);transform:rotate(18deg)}
#glow .a3{width:84vmax;height:32vmax;right:-26vmax;bottom:4vmax;border:1.1vmax solid rgba(205,236,255,.38);filter:blur(.9vmax);transform:rotate(-34deg)}
html[data-glass="new"] #glow{opacity:1}
html[data-glass="new"] .glass{
  background-color:rgba(255,255,255,.02);
  background-image:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.02) 36%,rgba(255,255,255,.03) 64%,rgba(255,255,255,.13));
  border:1.5px solid rgba(190,225,255,.55);
  -webkit-backdrop-filter:blur(10px) saturate(170%) brightness(1.06);backdrop-filter:blur(10px) saturate(170%) brightness(1.06);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 1px 0 0 rgba(255,255,255,.28),inset 0 -12px 22px rgba(120,190,255,.16),0 16px 46px rgba(0,0,0,.5);
  text-shadow:0 1px 12px rgba(0,0,0,.6)}
html[data-glass="new"] .panel,html[data-glass="new"] .step,html[data-glass="new"] .tli,html[data-glass="new"] .detail,html[data-glass="new"] .tabs,html[data-glass="new"] .quote,html[data-glass="new"] .heroPanel,html[data-glass="new"] .gf{border-radius:30px}
html[data-glass="new"] .tab[aria-selected=true]{background:rgba(190,225,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
html[data-glass="new"] .bars div{background:rgba(255,255,255,.06);border-color:rgba(190,225,255,.35)}
.num{display:block;font:700 clamp(64px,9vw,128px)/.85 Oswald,"Arial Narrow",Impact,sans-serif;letter-spacing:.02em;margin:0 0 8px;opacity:1;
  background:linear-gradient(180deg,#fff 25%,rgba(255,255,255,.22));-webkit-background-clip:text;background-clip:text;color:transparent}
.gal{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
html[data-glass="new"] section:not(#top)::before,html[data-glass="new"] section:not(#top)::after{display:none}
html[data-glass="new"] #glow .a1{border-color:rgba(70,150,255,.22);filter:blur(3.2vmax)}
html[data-glass="new"] #glow .a2{border-color:rgba(120,200,255,.16);filter:blur(2.6vmax)}
html[data-glass="new"] #glow .a3{border-color:rgba(205,236,255,.3);filter:blur(1.1vmax)}
@media(min-width:761px){.num{font-family:"Share Tech Mono","IBM Plex Mono",monospace;font-weight:400;letter-spacing:.04em;line-height:.9}}
@media(max-width:760px){
 .num{font-family:"Share Tech Mono","IBM Plex Mono",monospace;font-weight:400;letter-spacing:.04em;line-height:.9}
 nav a:nth-child(2),nav a:nth-child(5),nav a:nth-child(6){display:none}
 nav{overflow:visible;max-width:calc(100% - 84px);padding:4px;gap:2px}
 nav a{padding:6px 14px;font-size:14px}
 .gear{width:40px;height:40px}
}
footer p{margin:22px 0 0}
.totop{appearance:none;-webkit-appearance:none;margin:0;cursor:pointer;display:inline-flex;align-items:center;gap:12px;padding:15px 34px;border-radius:12px;color:#fff;font:14px "Share Tech Mono",monospace;letter-spacing:.14em;text-transform:uppercase;transition:opacity .9s ease,transform .45s cubic-bezier(.2,.8,.2,1),background-color .25s}
.totop:hover,.totop:focus-visible{transform:translateY(-3px);background-color:rgba(255,255,255,.14)}
.totop:focus-visible{outline:2px solid var(--tan)}
.totop svg{transition:transform .3s}.totop:hover svg{transform:translateY(-3px)}
</style>
</head>

/* ---- starfield with gravitational lensing ---- */
var cv=document.getElementById("sky"),g=cv.getContext("2d"),W,H,dpr,stars=[];
var m={x:-999,y:-999,s:0,t:0,active:false};
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.round(W*H/2600);stars=[];
  for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.25,a:Math.random()*.7+.3,p:Math.random()*6.28});
}
addEventListener("resize",function(){resize();kick()});resize();
var running=false,lastMove=0;
function kick(){lastMove=performance.now();if(!running){running=true;requestAnimationFrame(frame)}}
function move(e){var p=e.touches?e.touches[0]:e;m.x=p.clientX;m.y=p.clientY;m.active=true;kick()}
addEventListener("pointermove",move);
addEventListener("touchmove",move,{passive:true});
document.addEventListener("mouseleave",function(){m.active=false;kick()});addEventListener("touchend",function(){m.active=false;kick()});
addEventListener("blur",function(){m.active=false;kick()});
function frame(t){
  m.s+=((m.active?1:0)-m.s)*.08;
  if(m.s<.002)m.s=0;
  g.clearRect(0,0,W,H);
  var R=Math.min(90,Math.max(55,W*.06))*m.s,cx=m.x,cy=m.y;
  g.fillStyle="#fff";
  for(var i=0;i<stars.length;i++){
    var s=stars[i],x=s.x,y=s.y,r=s.r,a=s.a*(.75+.25*Math.sin(t*.0015+s.p));
    if(R>1){
      var dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy)||1;
      if(d<R*7){
        var d2=(d+Math.sqrt(d*d+4*R*R))/2;
        x=cx+dx/d*d2;y=cy+dy/d*d2;
        var k=Math.exp(-Math.abs(d2-R*1.35)/(R*.6));
        r*=1+k*1.6;a=Math.min(1,a+k*.5);
      }
    }
    g.globalAlpha=a;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
  }
  g.globalAlpha=1;
  if(false){
    var gr=g.createRadialGradient(cx,cy,R*.5,cx,cy,R*1.25);
    gr.addColorStop(0,"rgba(0,0,0,1)");gr.addColorStop(.55,"rgba(0,0,0,.95)");
    gr.addColorStop(.72,"rgba(138,117,96,"+(.55*m.s)+")");gr.addColorStop(.82,"rgba(227,227,227,"+(.25*m.s)+")");gr.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R*1.25,0,6.283);g.fill();
    g.fillStyle="#000";g.beginPath();g.arc(cx,cy,R*.58,0,6.283);g.fill();
  }
  var goal=m.active?1:0;
  if(Math.abs(goal-m.s)<.01&&(!m.active||performance.now()-lastMove>700))running=false;else requestAnimationFrame(frame);
}
